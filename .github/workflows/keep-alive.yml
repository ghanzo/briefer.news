# Guards against GitHub's 60-day inactivity rule: scheduled workflows in a
# repo with no commit activity for 60 days are silently disabled — the worst
# failure mode for an autonomous pipeline (quiet death of every cloud cron).
# A weekly stamp commit makes that structurally impossible. The stamp goes to
# main because the inactivity check keys off default-branch activity.
name: keep-alive

on:
  workflow_dispatch:
  schedule:
    - cron: '19 15 * * 1'   # weekly, Monday 15:19 UTC — odd minute per conventions

permissions:
  contents: write

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit weekly activity stamp
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/.keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/.keepalive
          git commit -m "keep-alive: weekly activity stamp [skip ci]" || { echo "nothing to commit"; exit 0; }
          git push
